# PostgreSQL 18 — small tuning for the Gridiron site envelope (~700 MB of the shared VPS-4).
#
# Sized for ONE app database with ~20 max connections. Container mem_limit is
# 700m; shared_buffers (256 MB) + connection overhead (~20 x ~10 MB) +
# maintenance/autovacuum headroom must stay inside it.
#
# Mounted read-only at /etc/postgresql/postgresql.conf by compose.yml
# (`postgres -c config_file=...`). Mount path note: the data volume mounts at
# /var/lib/postgresql with PGDATA=/var/lib/postgresql/data underneath.

# ── Memory (small box: keep the sum well under the 700 MB container cap) ──
shared_buffers = 256MB
effective_cache_size = 1536MB
maintenance_work_mem = 64MB
work_mem = 4MB
max_connections = 20

# ── Durability (same as any production Postgres; never relax these) ───────
fsync = on
synchronous_commit = on
wal_level = replica            # cheap insurance; harmless without archiving
archive_mode = off             # Tier-2 nightly dumps, not WAL archiving (see README)

# ── Autovacuum (weekly ETL churns staging tables; stay aggressive) ─────────
autovacuum = on
autovacuum_max_workers = 2

# ── Logging (audit + slow-query evidence; 90-day retention per §12) ────────
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 500   # ms: slow-query evidence
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '
log_lock_waits = on
log_temp_files = 0

# ── Security ───────────────────────────────────────────────────────────────
password_encryption = scram-sha-256
listen_addresses = '*'  # container-local; no published port, internal net only
ssl = off                  # plaintext only inside the compose network
