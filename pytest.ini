[pytest]
markers =
    slow: marks tests as slow (MCMC sampling) -- deselect with -m "not slow"
    integration: marks tests as integration (require live PostgreSQL DB) -- deselect with -m "not integration"
    network: marks tests as requiring nflreadpy/network cache access -- deselect with -m "not network"

# Coverage flags live in the Makefile `ci` target (not here) so single-file
# runs like `pytest backend/tests/test_api.py` don't fail the 70% gate.
# To measure coverage locally: pytest backend/tests/ --cov=ml --cov=pipeline --cov=backend --cov-report=term-missing
