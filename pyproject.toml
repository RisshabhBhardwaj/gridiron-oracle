[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "archive",
    "mutants",
    "frontend",
    "ml/mlartifacts",
    "ml/checkpoints",
    "ml/oof",
    "ml/onnx",
    "ml/notebooks",
]

[tool.ruff.lint]
select = ["E", "F"]
# E402 is intentionally ignored: several ML entrypoints must configure OpenMP
# before importing torch/xgboost/lightgbm to avoid macOS ARM runtime crashes.
# E501 is not enforced yet because this repo has long SQL strings and docs-heavy
# field declarations; black/formatting can be tightened in a dedicated pass.
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["E402", "F401", "F402", "F821", "F841", "E702", "E741"]
"scripts/*.py" = ["E402"]
