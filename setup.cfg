[mutmut]
# Phase 1 mutation scope: deterministic backend runtime paths first.
# Expand into ml/ and pipeline/ after this slice is stable and actionable.
paths_to_mutate =
    backend/app/core
    backend/app/api/alerts.py
    backend/app/api/settings.py
    backend/app/middleware.py
    backend/app/services/alert.py
    backend/app/services/edge_coordinator.py
    backend/app/services/exposure.py
    backend/app/services/ipc_client.py

tests_dir =
    backend/tests/test_mutation_runtime.py

pytest_add_cli_args_test_selection =
    -m
    not integration and not slow

also_copy =
    backend/tests/test_mutation_runtime.py
    conftest.py
    user_config.json
    releases/

do_not_mutate =
    backend/app/__init__.py
    backend/app/api/__init__.py
    backend/app/core/__init__.py
    backend/app/services/__init__.py

max_stack_depth = -1
mutate_only_covered_lines = true
