name: Nightly slow tests

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:       # allow manual trigger

permissions:
  contents: read

jobs:
  slow-tests:
    name: Bayesian calibration + slow suite
    runs-on: ubuntu-latest

    # No database service: the selection `-m slow` is backend/tests/test_bayesian_layer.py
    # only, and it does not connect to Postgres.

    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"
      OTEL_TRACES_EXPORTER: "none"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU-only torch first, as in ci.yml and backend/Dockerfile (see the note there).
      - name: Install CPU-only torch
        run: pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch

      # requirements-test.txt adds the pinned pytest-timeout that provides --timeout.
      - name: Install backend deps and test tooling
        run: pip install --no-cache-dir -r backend/requirements-test.txt

      - name: Run slow test suite
        run: |
          python -m pytest backend/tests/ -v -m "slow" \
            --cov=ml --cov=backend \
            --cov-report=term-missing \
            --timeout=600
