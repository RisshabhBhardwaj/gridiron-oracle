name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job here only reads the repository.
permissions:
  contents: read

# The jobs below run the gate from `make ci` (Makefile targets `ci`, `complexity`,
# `typecheck`, `engine`) natively on the runner instead of through docker compose.
# Keep the commands in step with the Makefile.

jobs:
  # The authoritative public-push gate. The local `.githooks/pre-push` hook is
  # convenience only — it runs on the contributor's machine and is skippable
  # with `--no-verify`. Mark this job as a required check on `main`.
  #
  # This runs the real hook with an empty remote-tracking set, so it enumerates
  # every object reachable from HEAD rather than an endpoint diff: blocked paths
  # introduced in an ancestor and deleted before the tip are still caught (C-07).
  push-gate:
    name: Public-push gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Validate the invocation against the pinned binary rather than assuming
      # it: the CLI was reworked mid-v8 and `gitleaks git` replaced
      # `gitleaks detect`. The hook picks whichever exists; this step fails
      # loudly here if neither does, instead of inside the gate.
      - name: Check the gitleaks invocation exists
        run: gitleaks git --help > /dev/null || gitleaks detect --help > /dev/null

      - name: Scan every object reachable from HEAD
        run: |
          set -euo pipefail
          # Drop remote-tracking refs so nothing is excluded from the scan.
          git for-each-ref --format='%(refname)' refs/remotes \
            | xargs -r -n1 git update-ref -d
          chmod +x .githooks/pre-push
          printf 'refs/heads/ci %s refs/heads/ci %s\n' \
            "$(git rev-parse HEAD)" \
            "0000000000000000000000000000000000000000" \
            | ./.githooks/pre-push origin "${{ github.server_url }}/${{ github.repository }}.git"

  lint:
    name: Ruff, complexity gate, evidence manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches local dev (Apple Silicon M-series)

      # Only the tools these steps call. No ML stack, so this job cannot fail on
      # disk space or install time.
      - name: Install lint tools
        run: pip install --no-cache-dir "ruff>=0.4" "radon>=6.0"

      - name: Ruff lint (make ci)
        run: ruff check .

      # Same rule as `make complexity`: any rank-F function fails the job.
      # radon exits 0 even when it finds one, so its output is checked here.
      - name: Complexity gate (make complexity)
        run: |
          set -euo pipefail
          output=$(radon cc -n F backend/app ml pipeline)
          if [ -n "$output" ]; then
            echo "$output"
            echo "Complexity gate FAILED: rank-F functions (radon CC > 40) detected."
            exit 1
          fi

      # Evidence under reports/ and ml/experiments/ is gitignored-plus-force-added,
      # so `git status` cannot report drift in it (audit C-29). The script imports
      # only the standard library (ml/artifact_manifest.py), so no ML stack is needed.
      - name: Evidence manifest
        run: python scripts/verify_evidence_manifest.py

  python:
    name: Pytest (offline subset, 80% coverage gate)
    runs-on: ubuntu-latest
    env:
      # No database service on purpose. The DB-backed tests in this subset read
      # DATABASE_URL (default localhost:15439) and skip when Postgres is unreachable
      # (db_conn fixtures and _skip_if_db_unreachable helpers). Their assertions need
      # seeded data that CI does not have, so starting an empty Postgres here would
      # turn skips into failures. `make ci` runs them against the compose database.
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"
      OTEL_TRACES_EXPORTER: "none"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU-only torch first, as backend/Dockerfile does. The default PyPI wheel
      # pulls several GB of nvidia-* CUDA packages; with them, this job ran out of
      # disk (run 32920850950: "No space left on device"). --no-cache-dir keeps pip
      # from keeping a second copy of every wheel.
      - name: Install CPU-only torch
        run: pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install backend deps
        # -test file pulls in requirements.txt plus the pytest stack this job runs.
        run: pip install --no-cache-dir -r backend/requirements-test.txt

      - name: Fail if torch is not the CPU build
        run: |
          python -c "import sys, torch; sys.exit(0 if '+cpu' in torch.__version__ else 'torch is not the CPU build: ' + torch.__version__)"

      - name: Pytest with coverage gate (make ci)
        # Explicit directory with `python -m pytest`: a bare `pytest` can abort
        # during collection and still exit 0 (see root-level mlflow scratch files).
        # -rs prints why each test skipped, so DB-backed skips are visible in the log.
        run: |
          python -m pytest backend/tests/ -v -rs \
            -m "not integration and not network and not slow" \
            --cov=ml --cov=pipeline --cov=backend \
            --cov-report=term-missing --cov-fail-under=80

  schema-migrations:
    name: Alembic upgrade-downgrade-upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle -d oracle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://oracle:oracle@localhost:5432/oracle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The revisions and alembic/env.py import only alembic, sqlalchemy and the
      # standard library, so the ML stack is not installed here.
      - name: Install migration dependencies
        run: pip install --no-cache-dir "alembic>=1.13" "sqlalchemy>=2.0" "psycopg2-binary>=2.9"

      - name: Prove migration reversibility on an empty database
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  cpp:
    name: C++ build + ctest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Boost enables ws_integration_tests (engine/CMakeLists.txt, find_package(Boost 1.82)).
      - name: Install Boost
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev

      # Same flags as `make engine`.
      - name: CMake configure
        run: cmake -B engine/build engine/ -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=17 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build engine/build -j"$(nproc)"

      # Runs every discovered test, as `make ci` does. --no-tests=error makes a
      # configure that discovers zero tests fail rather than pass silently.
      - name: Test (ctest, as make ci)
        run: ctest --test-dir engine/build --output-on-failure --no-tests=error

  frontend:
    name: TypeScript typecheck, Vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Type check (make typecheck)
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
