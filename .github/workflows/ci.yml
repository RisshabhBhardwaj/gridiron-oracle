name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The authoritative public-push gate. The local `.githooks/pre-push` hook is
  # convenience only — it runs on the contributor's machine and is skippable
  # with `--no-verify`. Mark this job as a required check on `main`.
  #
  # This runs the real hook with an empty remote-tracking set, so it enumerates
  # every object reachable from HEAD rather than an endpoint diff: blocked paths
  # introduced in an ancestor and deleted before the tip are still caught (C-07).
  push-gate:
    name: Public-push gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Validate the invocation against the pinned binary rather than assuming
      # it: the CLI was reworked mid-v8 and `gitleaks git` replaced
      # `gitleaks detect`. The hook picks whichever exists; this step fails
      # loudly here if neither does, instead of inside the gate.
      - name: Check the gitleaks invocation exists
        run: gitleaks git --help > /dev/null || gitleaks detect --help > /dev/null

      - name: Scan every object reachable from HEAD
        run: |
          set -euo pipefail
          # Drop remote-tracking refs so nothing is excluded from the scan.
          git for-each-ref --format='%(refname)' refs/remotes \
            | xargs -r -n1 git update-ref -d
          chmod +x .githooks/pre-push
          printf 'refs/heads/ci %s refs/heads/ci %s\n' \
            "$(git rev-parse HEAD)" \
            "0000000000000000000000000000000000000000" \
            | ./.githooks/pre-push origin "${{ github.server_url }}/${{ github.repository }}.git"

  python:
    name: Python tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # matches local dev (Apple Silicon M-series)

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Ruff lint
        run: ruff check .

      # Evidence under reports/ and ml/experiments/ is gitignored-plus-force-added,
      # so `git status` cannot report drift in it (audit C-29).
      - name: Evidence manifest
        run: python scripts/verify_evidence_manifest.py

      - name: Pytest (unit + API — no DB required)
        # Exclude integration tests (require live PostgreSQL) and slow MCMC tests
        run: |
          export KMP_DUPLICATE_LIB_OK=TRUE
          export OMP_NUM_THREADS=1
          export OTEL_TRACES_EXPORTER=none
          pytest backend/tests/ -v -m "not integration and not slow and not network"

  schema-migrations:
    name: Alembic upgrade-downgrade-upgrade
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: oracle
          POSTGRES_PASSWORD: oracle
          POSTGRES_DB: oracle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oracle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://oracle:oracle@localhost:5432/oracle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install migration dependencies
        run: pip install -r backend/requirements.txt

      - name: Prove migration reversibility on an empty database
        run: |
          set -euo pipefail
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  cpp:
    name: C++ build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Boost
        run: sudo apt-get update && sudo apt-get install -y libboost-all-dev

      - name: CMake configure
        run: cmake -B engine/build engine/ -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build engine/build -j$(nproc)

      - name: Run all C++ tests (unified run_tests binary)
        # Runs all 4 suites: ring_buffer, kelly, exposure_manager, ipc_bridge
        run: ./engine/build/run_tests

  frontend:
    name: TypeScript type check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests (Vitest)
        working-directory: frontend
        run: npm test -- --run
