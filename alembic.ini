# Alembic configuration for Gridiron Oracle.
# Override sqlalchemy.url via DATABASE_URL / pipeline.schema.upgrade_head().

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Host default matches compose-published Postgres (15439).
sqlalchemy.url = postgresql://oracle:oracle@localhost:15439/oracle

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
